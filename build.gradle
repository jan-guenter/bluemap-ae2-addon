                    quartzGlassProfile.textures?.toSet()?.size() != 19 ||
                    quartzGlassProfile.resourcePartition != [
                            pathCount                     : 22,
                            blockstateCount               : 2,
                            modelCount                    : 1,
                            textureCount                  : 19,
                            totalBytes                    : 4187,
                            manifestFormat                :
                                    'path-tab-bytes-tab-sha256-lf',
                            manifestSha256                :
                                    'b51c708e7c4d26093c1b6f85b88d0be50572d3cfa76dbf802720f6ad79c7a7fa',
                            textureManifestSha256         :
                                    '65005c9b76800cdeba5c4598472a44dea131c9974672f89bf421452755fefb6a',
                            canonicalFormat               :
                                    'sha256-tab-bytes-tab-path-lf',
                            canonicalManifestSha256       :
                                    '3704e90b1c8ec9ee5a7d7215995869500b50c9b61a797584f6732713dab7103d',
                            canonicalTextureManifestSha256:
                                    'f9373f23e0924f6f2e7315ffb42f4d12b01d6d81b4996651917b865166d04e15'
                    ] ||
                    quartzGlassProfile.requiredResourcesManifestSha256 !=
                            'b51c708e7c4d26093c1b6f85b88d0be50572d3cfa76dbf802720f6ad79c7a7fa') {
                throw new GradleException('Packaged AE2 M3c profile identity mismatch')
            }

            def quartzGlassManifestEntry = zipFile.getEntry(
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/quartz-glass/' +
                            'required-resources.tsv'
            )
            def quartzGlassManifestBytes = zipFile
                    .getInputStream(quartzGlassManifestEntry)
