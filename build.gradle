                    profile.textures != profile.coreTextures + profile.driveTextures ||
                    profile.textures?.size() != 158 ||
                    profile.textures?.toSet()?.size() != 158 ||
                    profile.coreTextureManifestSha256 !=
                            'e40a9bc4942d8999d825f42bce94947079948d74024f4f1a078cc55252d81d33' ||
                    profile.textureManifestSha256 !=
                            'c0e66d75cad06649b021f8a9073629d6619050c4f69e78c522b6fa32fb232242' ||
                    profile.resourcePartitions != [
                            coreM0ThroughM2: [
                                    pathCount     : 170,
                                    textureCount  : 148,
                                    manifestSha256:
                                            '4f783945d92be446c8e5939f9455b24f9d463cb39f6b4e35e76c9b6fb713b3c2'
                            ],
                            m3aDrive      : [
                                    pathCount     : 26,
                                    textureCount  : 10,
