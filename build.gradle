                        it.startsWith('assets/mekanism/')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden}")
            }

            def unexpected = entries.findAll {
                !(it == 'META-INF/MANIFEST.MF') &&
                        !(it in requiredEntries) &&
                        !(it.startsWith('io/github/janguenter/bluemap/ae2/') &&
                                it.endsWith('.class'))
            }
            if (!unexpected.isEmpty()) {
                throw new GradleException("Production JAR contains unexpected entries: ${unexpected}")
            }

            def projectClasses = entries.findAll {
                it.startsWith('io/github/janguenter/bluemap/ae2/') && it.endsWith('.class')
            }
            if (projectClasses.isEmpty()) {
                throw new GradleException('Production JAR contains no project classes')
            }
            projectClasses.each { className ->
                def header = zipFile.getInputStream(zipFile.getEntry(className)).withCloseable {
                    it.readNBytes(8)
                }
                if (header.length != 8) {
                    throw new GradleException(
                            "${className} is not a complete class file"
                    )
                }
                def major = (Byte.toUnsignedInt(header[6]) << 8) |
                        Byte.toUnsignedInt(header[7])
                if (major != 65) {
                    throw new GradleException(
                            "${className} is not a Java 21 class file"
                    )
                }
            }
        } finally {
            zipFile.close()
        }
