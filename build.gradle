                    'bluemap-ae2/profiles/extendedae/1.21-2.2.33-neoforge/profile.json',
                    'bluemap-ae2/profiles/extendedae/1.21-2.2.33-neoforge/' +
                            'required-resources.tsv',
                    'bluemap-ae2/support-matrix.json',
                    'META-INF/LICENSE-bluemap-ae2-addon',
                    'META-INF/LICENSES/GPL-3.0-only.txt',
                    'META-INF/LICENSES/LGPL-3.0-only.txt',
                    'META-INF/LICENSES/MIT.txt',
                    'META-INF/NOTICE-bluemap-ae2-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-ae2-addon.md',
                    'META-INF/bluemap-ae2/upstreams.json'
            ]
            def missing = requiredEntries.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Production JAR is missing required entries: ${missing}")
            }

            def readJson = { String entryName ->
                def content = zipFile.getInputStream(zipFile.getEntry(entryName)).withCloseable {
                    it.getText('UTF-8')
                }
                new groovy.json.JsonSlurper().parseText(content)
            }

            def manifest = new java.util.jar.Manifest(
                    zipFile.getInputStream(zipFile.getEntry('META-INF/MANIFEST.MF'))
            )
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Automatic-Module-Name') !=
                    'io.github.janguenter.bluemap.ae2' ||
                    attributes.getValue('Implementation-Title') != addon_name ||
                    attributes.getValue('Implementation-Version') !=
                            project.version.toString()) {
                throw new GradleException('Production JAR manifest identity mismatch')
            }

            def addonInfo = readJson('bluemap.addon.json')
            if (addonInfo.id != addon_id ||
                    addonInfo.entrypoint !=
                            'io.github.janguenter.bluemap.ae2.BlueMapAe2Addon' ||
                    addonInfo.dependencies != [] || addonInfo['soft-dependencies'] != []) {
                throw new GradleException('bluemap.addon.json does not match the add-on contract')
            }

