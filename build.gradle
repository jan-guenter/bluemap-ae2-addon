                    'META-INF/THIRD_PARTY-bluemap-ae2-addon.md',
                    'META-INF/bluemap-ae2/upstreams.json'
            ]
            def expectedEntries = (sourceEntries + requiredEntries).toSet()
            def forbiddenThirdParty = entries.findAll {
                it.endsWith('.jar') ||
                        it.startsWith('appeng/') ||
                        it.startsWith('com/glodblock/github/extendedae/') ||
                        it.startsWith('gripe/_90/megacells/') ||
                        it.startsWith('lu/kolja/expandedae/') ||
                        it.startsWith('net/pedroksl/advanced_ae/') ||
                        it.startsWith('me/ramidzkh/mekae2/') ||
                        it.startsWith('mekanism/') ||
                        it.startsWith('net/minecraft/') ||
                        it.startsWith('net/neoforged/') ||
                        it.startsWith('assets/ae2/') ||
                        it.startsWith('assets/extendedae/') ||
                        it.startsWith('assets/megacells/') ||
                        it.startsWith('assets/expandedae/') ||
                        it.startsWith('assets/advanced_ae/') ||
                        it.startsWith('assets/appmek/') ||
                        it.startsWith('assets/mekanism/')
            }
            if (!forbiddenThirdParty.isEmpty()) {
                throw new GradleException(
                        "Sources JAR contains forbidden third-party entries: " +
                                forbiddenThirdParty
                )
            }
            def missing = expectedEntries - entries.toSet()
            def unexpected = entries.toSet() - expectedEntries
            if (!missing.isEmpty() || !unexpected.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch; missing=${missing}, " +
                                "unexpected=${unexpected}"
                )
            }
        } finally {
            zipFile.close()
        }
    }
}

