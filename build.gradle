                        id = 'jan-guenter'
                        name = 'Jan Guenter'
                        url = 'https://github.com/jan-guenter'
                    }
                }
                scm {
                    connection =
                            'scm:git:https://github.com/jan-guenter/bluemap-ae2-addon.git'
                    developerConnection =
                            'scm:git:ssh://git@github.com/jan-guenter/bluemap-ae2-addon.git'
                    url = 'https://github.com/jan-guenter/bluemap-ae2-addon'
                    tag = "v${project.version}"
                }
            }
        }
    }
}

def releaseCandidateManifest = layout.projectDirectory.file(
        "release-candidates/${project.version}.json"
)
def generatedModuleMetadata = layout.buildDirectory.file(
        'publications/addon/module.json'
)

tasks.register('verifyReleaseCandidate') {
    dependsOn tasks.named('verifyReleaseMetadata')
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
    dependsOn tasks.named('verifyPublicationPom')
    dependsOn tasks.named('generateMetadataFileForAddonPublication')

    inputs.file(releaseCandidateManifest)
            .withPropertyName('releaseCandidateManifest')
            .optional()
    inputs.file(productionJar).withPropertyName('productionJar')
    inputs.file(sourceArchive).withPropertyName('sourcesJar')
    inputs.file(generatedPom).withPropertyName('publicationPom')
    inputs.file(generatedModuleMetadata).withPropertyName('moduleMetadata')

    doLast {
        def candidateFile = releaseCandidateManifest.asFile
        if (!candidateFile.isFile()) {
            throw new GradleException(
                    "Missing release candidate manifest ${candidateFile}; " +
                            'stage and accept the exact release-version CI artifacts first'
            )
        }

        try {
            providers.exec {
                commandLine 'python3', '-c', '''
import json
import sys


def reject_duplicate_keys(pairs):
    result = {}
    for key, value in pairs:
        if key in result:
            raise ValueError("duplicate JSON key")
        result[key] = value
    return result


try:
    with open(sys.argv[1], "r", encoding="utf-8") as candidate:
        json.load(candidate, object_pairs_hook=reject_duplicate_keys)
except (OSError, UnicodeError, ValueError):
    raise SystemExit(2)
''', candidateFile.absolutePath
            }.result.get()
        } catch (Exception exception) {
            throw new GradleException(
                    'Release candidate must be valid UTF-8 JSON without duplicate keys',
                    exception
            )
        }

        def candidate = new groovy.json.JsonSlurper().parse(candidateFile)
        def requireExactKeys = { Object value, Set<String> expected, String location ->
            if (!(value instanceof Map) || (value.keySet() as Set) != expected) {
                def actual = value instanceof Map ? value.keySet() : value?.getClass()?.name
                throw new GradleException(
                        "${location} keys are ${actual}; expected exactly ${expected}"
                )
            }
        }

        requireExactKeys(
                candidate,
                ['schemaVersion', 'project', 'version', 'promotionJava',
                 'evidence', 'artifacts'] as Set,
                'release candidate root'
        )
        if (candidate.schemaVersion != 1 ||
                candidate.project != "${addon_group}:${artifact_id}" ||
                candidate.version != project.version.toString()) {
            throw new GradleException('Release candidate project/version identity mismatch')
        }

        requireExactKeys(
                candidate.promotionJava,
                ['distribution', 'version'] as Set,
                'promotionJava'
        )
        if (candidate.promotionJava.distribution != promotionJavaDistribution ||
                candidate.promotionJava.version != promotionJavaVersion) {
            throw new GradleException(
                    "Release candidate must use ${promotionJavaDistribution} " +
                            promotionJavaVersion
            )
        }

        requireExactKeys(candidate.evidence, ['id', 'acceptedOn'] as Set, 'evidence')
        if (!(candidate.evidence.id instanceof String) ||
                !(candidate.evidence.id ==~ /[A-Za-z0-9][A-Za-z0-9._:-]{0,127}/)) {
            throw new GradleException(
                    'Release candidate evidence.id must be a bounded non-sensitive opaque ID'
            )
        }
        if (!(candidate.evidence.acceptedOn instanceof String)) {
            throw new GradleException(
                    'Release candidate evidence.acceptedOn must be an ISO-8601 date'
            )
        }
        try {
            def acceptedOn = java.time.LocalDate.parse(candidate.evidence.acceptedOn)
            if (acceptedOn.toString() != candidate.evidence.acceptedOn) {
                throw new java.time.format.DateTimeParseException(
                        'Non-canonical ISO-8601 date',
                        candidate.evidence.acceptedOn,
                        0
                )
            }
        } catch (java.time.format.DateTimeParseException exception) {
            throw new GradleException(
                    'Release candidate evidence.acceptedOn must be an ISO-8601 date',
                    exception
            )
        }

        requireExactKeys(
                candidate.artifacts,
                ['productionJar', 'sourcesJar', 'pom', 'moduleMetadata'] as Set,
                'artifacts'
        )
        def expectedArtifacts = [
                productionJar : productionJar.get().asFile,
                sourcesJar    : sourceArchive.get().asFile,
                pom           : generatedPom.get().asFile,
                moduleMetadata: generatedModuleMetadata.get().asFile
        ]
        def sha256 = { File artifact ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int length
                while ((length = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, length)
                }
            }
            digest.digest().encodeHex().toString()
        }

        expectedArtifacts.each { String name, File artifact ->
            if (!artifact.isFile() || artifact.length() == 0) {
                throw new GradleException(
                        "Release candidate artifact ${name} is missing or empty"
                )
            }
            def record = candidate.artifacts[name]
            requireExactKeys(record, ['sizeBytes', 'sha256'] as Set, "artifacts.${name}")
            if (!(record.sizeBytes instanceof Number) ||
                    record.sizeBytes.toString() !=
                            Long.toString(record.sizeBytes.longValue()) ||
                    record.sizeBytes.longValue() != artifact.length()) {
                throw new GradleException(
                        "Release candidate size mismatch for ${name}"
                )
            }
            if (!(record.sha256 instanceof String) ||
                    !(record.sha256 ==~ /[0-9a-f]{64}/) ||
                    record.sha256 != sha256(artifact)) {
                throw new GradleException(
                        "Release candidate SHA-256 mismatch for ${name}"
                )
            }
        }
    }
}
