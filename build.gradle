            def resourceManifestSha256 = java.security.MessageDigest
                    .getInstance('SHA-256')
                    .digest(resourceManifestBytes)
                    .encodeHex()
                    .toString()
            def resourceManifestLines = new String(
                    resourceManifestBytes,
