                            ],
                            occupiedModelCount: 12,
                            ledPolicy        : 'static-offline-unknown',
                            unknownCellPolicy:
                                    'atomic-whole-block-original-resource-fallback'
                    ] ||
                    profile.coreTextures?.size() != 148 ||
                    profile.coreTextures?.toSet()?.size() != 148 ||
                    profile.driveTextures?.size() != 10 ||
                    profile.driveTextures?.toSet()?.size() != 10 ||
                    !java.util.Collections.disjoint(
                            profile.coreTextures.toSet(),
                            profile.driveTextures.toSet()
