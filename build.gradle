                    quartzGlassProfile.profileId != 'ae2-quartz-glass' ||
                    quartzGlassProfile.modId != 'ae2' ||
                    quartzGlassProfile.version != '19.2.17' ||
                    quartzGlassProfile.sizeBytes != 8230896 ||
                    quartzGlassProfile.sha1 !=
                            '49c18d6a4af487957d7e5a6ad5dcbf71090b8e14' ||
                    quartzGlassProfile.sha256 !=
                            '460d779a0609b81409907d9956de8f6f70a1b0912257e3e5c3c7e75ac9630e95' ||
                    quartzGlassProfile.coverageMilestone != 'M3c' ||
                    quartzGlassProfile.runtimeAcceptance !=
