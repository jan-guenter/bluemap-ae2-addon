// SPDX-License-Identifier: LGPL-3.0-only

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    systemProperty 'bluemapAe2.testAe2Jar',
            providers.gradleProperty('ae2Jar').getOrElse('')
    systemProperty 'bluemapAe2.testMinecraftClientJar',
            providers.gradleProperty('minecraftClientJar').getOrElse('')
    systemProperty 'bluemapAe2.testBlueMapSourcePath',
            providers.gradleProperty('bluemapSourcePath').getOrElse('')
    systemProperty 'bluemapAe2.testAppMekJar',
            providers.gradleProperty('m45AppMekJar').getOrElse('')
    systemProperty 'bluemapAe2.testMekanismJar',
            providers.gradleProperty('m45MekanismJar').getOrElse('')
}

tasks.register('testRuntimeEvidenceAnalyzer', Exec) {
    inputs.files(
            fileTree('tools') {
                include '**/*.py'
                include '**/*.json'
                include '**/*.b64'
            },
            'gallery/cases.json'
    )
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'tools/tests', '-p', 'test_*.py', '-v'
}

def expectedBlueMapCommit = '9be321df995a1103808621d529eb72773e719d4d'
def expectedBlueMapApiCommit = '285c9a60eff3ac2b0cab308ce1058d1565be0971'
def blueMapSourceDir = providers.gradleProperty('bluemapSourcePath')
        .map { file(it) }
        .orElse(file('../bluemap-backport'))

tasks.register('verifyBlueMapSource') {
    inputs.dir(blueMapSourceDir)

    doLast {
        def resolveHead = { File repository ->
            providers.exec {
                commandLine 'git', '-C', repository.absolutePath, 'rev-parse', 'HEAD'
            }.standardOutput.asText.get().trim()
        }
        def blueMapHead = resolveHead(blueMapSourceDir.get())
        if (blueMapHead != expectedBlueMapCommit) {
            throw new GradleException(
                    "BlueMap source is ${blueMapHead}; expected ${expectedBlueMapCommit}"
            )
        }

        def apiHead = resolveHead(new File(blueMapSourceDir.get(), 'api'))
        if (apiHead != expectedBlueMapApiCommit) {
            throw new GradleException(
                    "BlueMapAPI source is ${apiHead}; expected ${expectedBlueMapApiCommit}"
            )
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('verifyBlueMapSource')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.ae2',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }

    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-ae2-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-ae2-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-ae2-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-ae2'
    }
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
}

tasks.named('sourcesJar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-ae2-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-ae2-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-ae2-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-ae2'
    }
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zipFile.entries()
                    .findAll { !it.directory }
                    .collect { it.name }

            def requiredEntries = [
                    'bluemap.addon.json',
                    'assets/bluemap_ae2/blockstates/drive.json',
                    'assets/bluemap_ae2/blockstates/crafting.json',
                    'assets/bluemap_ae2/blockstates/extendedae_ex_drive.json',
                    'assets/bluemap_ae2/blockstates/fluix_glass_cable.json',
                    'assets/bluemap_ae2/blockstates/crank.json',
                    'assets/bluemap_ae2/blockstates/inscriber.json',
                    'assets/bluemap_ae2/blockstates/paint.json',
                    'assets/bluemap_ae2/blockstates/quantum_bridge.json',
                    'assets/bluemap_ae2/blockstates/quartz_glass.json',
                    'assets/bluemap_ae2/blockstates/sky_stone_chest.json',
                    'assets/bluemap_ae2/blockstates/spatial_pylon.json',
                    'assets/bluemap_ae2/blockstates/m45.json',
                    'bluemap-ae2/profiles/appflux/1.21-2.1.5-neoforge/profile.json',
                    'bluemap-ae2/profiles/appflux/1.21-2.1.5-neoforge/' +
                            'required-resources.tsv',
                    'bluemap-ae2/profiles/merequester/1.21.1-1.4.3/profile.json',
                    'bluemap-ae2/profiles/merequester/1.21.1-1.4.3/' +
                            'required-resources.tsv',
                    'bluemap-ae2/profiles/expandedae/2.1.1/profile.json',
                    'bluemap-ae2/profiles/expandedae/2.1.1/required-resources.tsv',
                    'bluemap-ae2/profiles/megacells/4.11.0/profile.json',
                    'bluemap-ae2/profiles/megacells/4.11.0/cell-models.tsv',
                    'bluemap-ae2/profiles/megacells/4.11.0/' +
                            'required-cell-dock-resources.tsv',
                    'bluemap-ae2/profiles/megacells/4.11.0/' +
                            'required-crafting-resources.tsv',
                    'bluemap-ae2/profiles/megacells/4.11.0/' +
                            'required-dependent-ae2-resources.tsv',
                    'bluemap-ae2/profiles/megacells/4.11.0/' +
                            'required-generic-part-resources.tsv',
                    'bluemap-ae2/profiles/advancedae/1.6.12/' +
                            'quantum-required-resources.tsv',
                    'bluemap-ae2/profiles/advancedae/1.6.12/' +
                            'athena-required-resources.tsv',
                    'bluemap-ae2/profiles/extendedae/1.21-2.2.35-neoforge/' +
                            'm5-required-resources.tsv',
                    'bluemap-ae2/profiles/appmek/1.6.3/profile.json',
                    'bluemap-ae2/profiles/appmek/1.6.3/drive-required-resources.tsv',
                    'bluemap-ae2/profiles/ae2/19.2.17/profile.json',
                    'bluemap-ae2/profiles/ae2/19.2.17/required-resources.sha256',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/quartz-glass/profile.json',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/quartz-glass/' +
                            'required-resources.tsv',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/crafting/profile.json',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/crafting/' +
                            'required-resources.tsv',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/quantum-bridge/profile.json',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/quantum-bridge/' +
                            'required-resources.tsv',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/m3-completion/profile.json',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/m3-completion/' +
                            'required-resources.tsv',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/cable-bus-structural/' +
                            'profile.json',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/cable-bus-structural/' +
                            'required-resources.sha256',
                    'bluemap-ae2/profiles/ae2/19.2.17/routes/cable-bus-structural/' +
