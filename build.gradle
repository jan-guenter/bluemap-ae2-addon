def releaseTag = providers.gradleProperty('releaseTag')
def promotionJavaDistribution = 'temurin'
def promotionJavaVersion = '21.0.12+8'

tasks.register('verifyReleaseMetadata') {
    inputs.file('CHANGELOG.md')
    inputs.property('releaseTag', releaseTag.orElse(''))

    doLast {
        def releaseVersion = project.version.toString()
        def semver = ~/(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?/
        if (!(releaseVersion ==~ semver)) {
            throw new GradleException("Unsupported SemVer release ${releaseVersion}")
        }
        if (releaseVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException('A release cannot use a SNAPSHOT version')
        }
        if (!releaseTag.isPresent() || releaseTag.get() != "v${releaseVersion}") {
            throw new GradleException('Release tag does not match the project version')
        }
        def heading = java.util.regex.Pattern.compile(
                '(?m)^## \\[' + java.util.regex.Pattern.quote(releaseVersion) +
                        '\\] - \\d{4}-\\d{2}-\\d{2}$'
        )
        if (!heading.matcher(file('CHANGELOG.md').getText('UTF-8')).find()) {
            throw new GradleException('CHANGELOG.md has no dated release heading')
        }
    }
}

def generatedPom = layout.buildDirectory.file('publications/addon/pom-default.xml')

tasks.register('verifyPublicationPom') {
    dependsOn tasks.named('generatePomFileForAddonPublication')
    inputs.file(generatedPom)

    doLast {
        def pom = new groovy.xml.XmlSlurper(false, false).parse(generatedPom.get().asFile)
        if (pom.groupId.text() != addon_group ||
                pom.artifactId.text() != artifact_id ||
                pom.version.text() != project.version.toString() ||
                pom.name.text() != addon_name ||
                pom.description.text() !=
                        'BlueMap 5.22 renderer add-on for Applied Energistics 2' ||
                pom.url.text() != 'https://github.com/jan-guenter/bluemap-ae2-addon' ||
                pom.licenses.license.url.text() !=
                        'https://spdx.org/licenses/LGPL-3.0-only.html' ||
                pom.dependencies.dependency.size() != 0) {
            throw new GradleException('Publication POM semantic contract mismatch')
        }
    }
}

