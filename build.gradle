            def profile = readJson('bluemap-ae2/profiles/ae2/19.2.17/profile.json')
            if (profile.schemaVersion != 3 ||
                    profile.modId != 'ae2' || profile.version != '19.2.17' ||
                    profile.sizeBytes != 8230896 ||
                    profile.sha256 !=
                            '460d779a0609b81409907d9956de8f6f70a1b0912257e3e5c3c7e75ac9630e95' ||
                    profile.coverageMilestone != 'M3a' ||
                    profile.transientPolicy != 'idle-off-unknown' ||
                    profile.supportedCenterParts?.size() != 85 ||
                    profile.supportedCenterParts?.toSet()?.size() != 85 ||
                    !profile.supportedCenterParts.contains('ae2:fluix_glass_cable') ||
                    !profile.supportedCenterParts.contains('ae2:red_smart_cable') ||
                    !profile.supportedCenterParts.contains('ae2:blue_covered_dense_cable') ||
                    !profile.supportedCenterParts.contains('ae2:green_smart_dense_cable') ||
                    profile.supportedFaceParts != [[
                            id: 'ae2:terminal', spins: [0, 1, 2, 3]
                    ]] ||
                    profile.facadePolicy != [
                            blockState: [Name: 'minecraft:stone'],
                            properties: 'forbidden',
                            maximumFacades: 1,
                            requiredSameFacePart: 'ae2:terminal'
                    ] ||
                    profile.supportedDrive != [
                            blockId          : 'ae2:drive',
                            slotCount        : 10,
                            baseModel        : 'ae2:block/drive/drive_base',
                            emptyCellModel   : 'ae2:block/drive/drive_cell_empty',
                            explicitCellModels: expectedDriveCellModels,
                            genericCellModel : [
                                    model  : 'ae2:block/drive/drive_cell',
