                    variant?.model != 'bluemap:block/missing') {
                throw new GradleException('Synthetic blockstate contract mismatch')
            }

            def driveSynthetic = readJson('assets/bluemap_ae2/blockstates/drive.json')
            def driveVariant = driveSynthetic.variants?.get('')
            if (driveVariant?.renderer != 'bluemap_ae2:drive' ||
                    driveVariant?.model != 'bluemap:block/missing') {
                throw new GradleException('Synthetic drive blockstate contract mismatch')
            }

            def extendedDriveSynthetic = readJson(
                    'assets/bluemap_ae2/blockstates/extendedae_ex_drive.json'
            )
            def extendedDriveVariant = extendedDriveSynthetic.variants?.get('')
            if (extendedDriveVariant?.renderer !=
                    'bluemap_ae2:extendedae_ex_drive' ||
                    extendedDriveVariant?.model != 'bluemap:block/missing') {
                throw new GradleException(
                        'Synthetic ExtendedAE Ex Drive blockstate contract mismatch'
                )
            }

            def quartzGlassSynthetic = readJson(
                    'assets/bluemap_ae2/blockstates/quartz_glass.json'
            )
            def quartzGlassVariant = quartzGlassSynthetic.variants?.get('')
            if (quartzGlassVariant?.renderer != 'bluemap_ae2:quartz_glass' ||
                    quartzGlassVariant?.model != 'bluemap:block/missing') {
                throw new GradleException(
                        'Synthetic AE2 quartz-glass blockstate contract mismatch'
                )
            }

            def craftingSynthetic = readJson(
                    'assets/bluemap_ae2/blockstates/crafting.json'
            )
            def craftingVariant = craftingSynthetic.variants?.get('')
            if (craftingVariant?.renderer != 'bluemap_ae2:crafting' ||
                    craftingVariant?.model != 'bluemap:block/missing') {
                throw new GradleException(
                        'Synthetic AE2 crafting blockstate contract mismatch'
                )
            }

            def quantumBridgeSynthetic = readJson(
                    'assets/bluemap_ae2/blockstates/quantum_bridge.json'
            )
            def quantumBridgeVariant = quantumBridgeSynthetic.variants?.get('')
            if (quantumBridgeVariant?.renderer != 'bluemap_ae2:quantum_bridge' ||
                    quantumBridgeVariant?.model != 'bluemap:block/missing') {
                throw new GradleException(
                        'Synthetic AE2 quantum-bridge blockstate contract mismatch'
                )
            }

            [
                    'crank',
                    'inscriber',
                    'paint',
                    'sky_stone_chest',
                    'spatial_pylon'
            ].each { String name ->
                def completionSynthetic = readJson(
                        "assets/bluemap_ae2/blockstates/${name}.json"
                )
                def completionVariant = completionSynthetic.variants?.get('')
                if (completionVariant?.renderer != 'bluemap_ae2:m3_completion' ||
                        completionVariant?.model != 'bluemap:block/missing') {
                    throw new GradleException(
                            "Synthetic AE2 M3f ${name} blockstate contract mismatch"
                    )
                }
            }

            def expectedDriveCellModels = [:]
            ['item_storage_cell_': 'item', 'fluid_storage_cell_': 'fluid'].each {
                String itemPrefix, String modelKind ->
                    ['1k', '4k', '16k', '64k', '256k'].each { String tier ->
                        expectedDriveCellModels["ae2:${itemPrefix}${tier}"] =
                                "ae2:block/drive/cells/${tier}_${modelKind}_cell"
                    }
            }
            expectedDriveCellModels['ae2:creative_storage_cell'] =
                    'ae2:block/drive/cells/creative_cell'
            ['portable_item_cell_': 'item', 'portable_fluid_cell_': 'fluid'].each {
                String itemPrefix, String modelKind ->
                    ['1k', '4k', '16k', '64k', '256k'].each { String tier ->
                        expectedDriveCellModels["ae2:${itemPrefix}${tier}"] =
                                "ae2:block/drive/cells/${tier}_${modelKind}_cell"
                    }
